# Experiment configuration. All parameters of the analysis live here.
seed: 42

paths:
  data: data/sample/sample_responses.csv   # replace with the real survey export in Week 7
  output_dir: results

# Independent variable "school type" is coded in the data column `school_type`
groups:
  state: 0
  private: 1

# Item numbers of the burnout questionnaire (MBI, Vodopyanova & Starchenkova adaptation).
# Columns in the CSV are q1..q22. Scale scores are plain sums of the listed items.
scale_keys:
  EE:  [1, 2, 3, 6, 8, 13, 14, 16, 20]      # emotional exhaustion, 0-54 (primary metric)
  DP:  [5, 10, 11, 15, 22]                  # depersonalization, 0-30
  RPA: [4, 7, 9, 12, 17, 18, 19, 21]        # reduced professional accomplishment, 0-48

# Independent variables describing working conditions (RQ2)
work_factors:
  - hours_week
  - class_size
  - report_hours
  - support
  - parent_pressure
  - stability

# RQ3 (exploratory): factor and burnout component for each hypothesis
rq3_hypotheses:
  H3a: [class_size, EE]
  H3b: [report_hours, EE]
  H3c: [parent_pressure, DP]
  H3d: [stability, EE]

# Guardrail metrics
guardrails:
  min_group_size: 15
  min_alpha: 0.7
